<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B2545"/>
      <stop offset="100%" stop-color="#13315C"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00B2A9"/>
      <stop offset="100%" stop-color="#00D3C4"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7FA8C9"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- decorative wheel motif -->
  <circle cx="1110" cy="70" r="42" fill="none" stroke="#1E4E79" stroke-width="6" opacity="0.5"/>
  <circle cx="1110" cy="70" r="8" fill="#1E4E79" opacity="0.5"/>
  <circle cx="70" cy="560" r="30" fill="none" stroke="#1E4E79" stroke-width="5" opacity="0.4"/>

  <!-- Title -->
  <text x="60" y="72" fill="#FFFFFF" font-size="34" font-weight="700">Comprehensive Divvy Bike-Sharing Analytics</text>
  <text x="60" y="102" fill="#7FA8C9" font-size="17">End-to-end data pipeline &#8226; 15.6M+ real trips &#8226; CRISP-DM methodology</text>

  <!-- Pipeline stages -->
  <g font-size="13" font-weight="600">
    <!-- Stage 1 -->
    <rect x="45" y="150" width="165" height="92" rx="10" fill="#13385C" stroke="#00B2A9" stroke-width="1.5"/>
    <text x="127" y="182" fill="#00D3C4" font-size="12" text-anchor="middle">STAGE 1</text>
    <text x="127" y="206" fill="#FFFFFF" text-anchor="middle">Data</text>
    <text x="127" y="222" fill="#FFFFFF" text-anchor="middle">Collection</text>
    <text x="127" y="238" fill="#9FB8CE" font-size="10.5" font-weight="400" text-anchor="middle">S3 · requests · tqdm</text>

    <!-- Stage 2 -->
    <rect x="235" y="150" width="165" height="92" rx="10" fill="#13385C" stroke="#00B2A9" stroke-width="1.5"/>
    <text x="317" y="182" fill="#00D3C4" font-size="12" text-anchor="middle">STAGE 2</text>
    <text x="317" y="206" fill="#FFFFFF" text-anchor="middle">Database</text>
    <text x="317" y="222" fill="#FFFFFF" text-anchor="middle">Design</text>
    <text x="317" y="238" fill="#9FB8CE" font-size="10.5" font-weight="400" text-anchor="middle">PostgreSQL star schema</text>

    <!-- Stage 3 -->
    <rect x="425" y="150" width="165" height="92" rx="10" fill="#13385C" stroke="#00B2A9" stroke-width="1.5"/>
    <text x="507" y="182" fill="#00D3C4" font-size="12" text-anchor="middle">STAGE 3</text>
    <text x="507" y="206" fill="#FFFFFF" text-anchor="middle">ETL</text>
    <text x="507" y="222" fill="#FFFFFF" text-anchor="middle">Pipeline</text>
    <text x="507" y="238" fill="#9FB8CE" font-size="10.5" font-weight="400" text-anchor="middle">COPY · staging · idempotent</text>

    <!-- Stage 4 -->
    <rect x="615" y="150" width="165" height="92" rx="10" fill="#13385C" stroke="#00B2A9" stroke-width="1.5"/>
    <text x="697" y="182" fill="#00D3C4" font-size="12" text-anchor="middle">STAGE 4</text>
    <text x="697" y="206" fill="#FFFFFF" text-anchor="middle">Data Quality</text>
    <text x="697" y="222" fill="#FFFFFF" text-anchor="middle">Assessment</text>
    <text x="697" y="238" fill="#9FB8CE" font-size="10.5" font-weight="400" text-anchor="middle">9-check independent audit</text>

    <!-- Stage 5 -->
    <rect x="805" y="150" width="165" height="92" rx="10" fill="#13385C" stroke="#00B2A9" stroke-width="1.5"/>
    <text x="887" y="182" fill="#00D3C4" font-size="12" text-anchor="middle">STAGE 5</text>
    <text x="887" y="206" fill="#FFFFFF" text-anchor="middle">Exploratory</text>
    <text x="887" y="222" fill="#FFFFFF" text-anchor="middle">Analysis</text>
    <text x="887" y="238" fill="#9FB8CE" font-size="10.5" font-weight="400" text-anchor="middle">Rider &amp; station insights</text>

    <!-- Stage 6 -->
    <rect x="995" y="150" width="160" height="92" rx="10" fill="#0F4C5C" stroke="#00D3C4" stroke-width="2"/>
    <text x="1075" y="182" fill="#00D3C4" font-size="12" text-anchor="middle">STAGE 6</text>
    <text x="1075" y="206" fill="#FFFFFF" text-anchor="middle">Demand</text>
    <text x="1075" y="222" fill="#FFFFFF" text-anchor="middle">Forecasting</text>
    <text x="1075" y="238" fill="#9FB8CE" font-size="10.5" font-weight="400" text-anchor="middle">Prophet vs. SARIMAX</text>
  </g>

  <!-- connecting arrows -->
  <g stroke="#7FA8C9" stroke-width="2" marker-end="url(#arrow)">
    <line x1="210" y1="196" x2="233" y2="196"/>
    <line x1="400" y1="196" x2="423" y2="196"/>
    <line x1="590" y1="196" x2="613" y2="196"/>
    <line x1="780" y1="196" x2="803" y2="196"/>
    <line x1="970" y1="196" x2="993" y2="196"/>
  </g>

  <!-- Stats bar -->
  <g>
    <rect x="45" y="290" width="1110" height="1" fill="#1E4E79"/>

    <text x="105" y="350" fill="#00D3C4" font-size="30" font-weight="700" text-anchor="middle">15.6M+</text>
    <text x="105" y="374" fill="#9FB8CE" font-size="12.5" text-anchor="middle">Trips ingested</text>

    <text x="290" y="350" fill="#00D3C4" font-size="30" font-weight="700" text-anchor="middle">974</text>
    <text x="290" y="374" fill="#9FB8CE" font-size="12.5" text-anchor="middle">Calendar days</text>

    <text x="475" y="350" fill="#00D3C4" font-size="30" font-weight="700" text-anchor="middle">3,943</text>
    <text x="475" y="374" fill="#9FB8CE" font-size="12.5" text-anchor="middle">Stations</text>

    <text x="660" y="350" fill="#00D3C4" font-size="30" font-weight="700" text-anchor="middle">0</text>
    <text x="660" y="374" fill="#9FB8CE" font-size="12.5" text-anchor="middle">Orphaned FKs</text>

    <text x="845" y="350" fill="#00D3C4" font-size="30" font-weight="700" text-anchor="middle">93.6%</text>
    <text x="845" y="374" fill="#9FB8CE" font-size="12.5" text-anchor="middle">Data completeness</text>

    <text x="1050" y="350" fill="#00D3C4" font-size="30" font-weight="700" text-anchor="middle">4,798.8</text>
    <text x="1050" y="374" fill="#9FB8CE" font-size="12.5" text-anchor="middle">Best RMSE (Prophet)</text>
  </g>

  <!-- Business questions strip -->
  <g>
    <rect x="45" y="410" width="1110" height="1" fill="#1E4E79"/>
    <text x="60" y="445" fill="#FFFFFF" font-size="15" font-weight="700">Answers six core business questions:</text>

    <text x="60" y="475" fill="#C7DAE8" font-size="12.5">1. Member vs. casual rider behavior</text>
    <text x="60" y="497" fill="#C7DAE8" font-size="12.5">2. Peak demand timing by segment</text>

    <text x="440" y="475" fill="#C7DAE8" font-size="12.5">3. Busiest stations &amp; rebalancing risk</text>
    <text x="440" y="497" fill="#C7DAE8" font-size="12.5">4. Anomalous demand spikes (z-score)</text>

    <text x="820" y="475" fill="#C7DAE8" font-size="12.5">5. Recreational vs. commuter riding</text>
    <text x="820" y="497" fill="#C7DAE8" font-size="12.5">6. 28-day ridership forecast</text>
  </g>

  <!-- Footer -->
  <rect x="0" y="560" width="1200" height="70" fill="#081B33"/>
  <text x="60" y="602" fill="#FFFFFF" font-size="14" font-weight="600">Python &#8226; PostgreSQL &#8226; Prophet / SARIMAX &#8226; Pandas &#8226; Jupyter</text>
  <text x="1140" y="602" fill="#7FA8C9" font-size="13" text-anchor="end">Seif H. Kungulio</text>
</svg>
